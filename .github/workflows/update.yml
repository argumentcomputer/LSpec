name: Update Lean toolchain and pinned deps

on:
  schedule:
    - cron: "0 12 * * *"
      timezone: America/New_York
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}

      # `dev` carries pinned-tag updates and lean4-nix gating; `main` only
      # mirrors upstream and ignores these inputs.
      - uses: argumentcomputer/lean-update@dev
        with:
          bump_mode: pinned-tags
          on_update_fails: pr
          update_lean4_nix: true
