name: Update Lean toolchain and pinned deps

on:
  schedule:
    - cron: "0 12 * * *"
      timezone: America/New_York
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # `dev` carries pinned-tag updates and lean4-nix gating; `main` only
      # mirrors upstream and ignores these inputs.
      - uses: argumentcomputer/lean-update@dev
        with:
          bump_mode: pinned-tags
          on_update_fails: pr
          update_lean4_nix: true
