name: CI Tests

on:
  push:
    branches: main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          build-args: "--wfail"

  # Builds the library and runs the test suite via Nix flake checks
  nix-test:
    name: Nix Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          github_access_token: ${{ github.token }}
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: argumentcomputer
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Build the library and test binary
      - run: nix build --print-build-logs --accept-flake-config
      # Run the test suite as a flake check
      - run: nix flake check --print-build-logs --accept-flake-config

  lints:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint, shellcheck over composite action scripts, pinact (actions
      # must be SHA-pinned with a matching version comment) and zizmor
      - uses: argumentcomputer/ci-workflows/.github/actions/lint-workflows@main
