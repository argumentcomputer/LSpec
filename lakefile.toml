name = "LSpec"
version = "3.0.0"
defaultTargets = ["LSpec"]
testDriver = "tests"

[[lean_lib]]
name = "LSpec"

[[lean_lib]]
name = "LSpecProofs"
moreLeanArgs = ["-DwarningAsError=true"]

[[lean_lib]]
name = "LSpecTests"
roots = ["LSpecTests.ImportCheck", "LSpecTests.Main"]

[[lean_exe]]
name = "tests"
root = "LSpecTests.Main"
